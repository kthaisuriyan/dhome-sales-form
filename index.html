<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ลูกค้าใหม่ — DHome Valley</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root { --g:#06C755; --gd:#05a647; --bg:#f5f6f7; --card:#fff; --tx:#1c1c1e; --mu:#6b7280; --bd:#d9dde2; --err:#d93025; --warn:#b26a00; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Sukhumvit Set","Noto Sans Thai",Tahoma,sans-serif; background:var(--bg); color:var(--tx);
         padding:env(safe-area-inset-top,0) 0 calc(env(safe-area-inset-bottom,0) + 90px); }
  header { background:var(--g); color:#fff; padding:14px 16px; }
  header h1 { margin:0; font-size:18px; }
  header small { opacity:.9; }
  form { padding:12px; }
  .card { background:var(--card); border-radius:12px; padding:14px; margin-bottom:12px; }
  label { display:block; font-weight:600; font-size:15px; margin:0 0 6px; }
  label .req { color:var(--err); }
  .field { margin-bottom:14px; }
  .field:last-child { margin-bottom:0; }
  input, textarea { width:100%; font-size:16px; padding:11px 12px; border:1px solid var(--bd); border-radius:10px; background:#fff; color:var(--tx); }
  textarea { min-height:64px; resize:vertical; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1px solid var(--bd); background:#fff; border-radius:999px; padding:9px 13px; font-size:15px; cursor:pointer; user-select:none; }
  .chip.on { background:var(--g); border-color:var(--g); color:#fff; }
  .hint { color:var(--mu); font-size:13px; margin-top:4px; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--bd);
         padding:10px 12px calc(env(safe-area-inset-bottom,0) + 10px); }
  button.main { width:100%; font-size:17px; font-weight:700; padding:14px; border:0; border-radius:12px; background:var(--g); color:#fff; }
  button.main:disabled { background:#9ad9b3; }
  button.sec { width:100%; font-size:16px; padding:12px; border:1px solid var(--bd); border-radius:12px; background:#fff; margin-top:8px; }
  .msg { padding:12px 14px; border-radius:10px; margin:12px; font-size:15px; display:none; }
  .msg.err { display:block; background:#fdecea; color:var(--err); }
  .msg.warn { display:block; background:#fff4e0; color:var(--warn); }
  .msg.ok { display:block; background:#e7f8ee; color:#0a7a3b; }
  #loading { padding:40px 16px; text-align:center; color:var(--mu); }
  #done { display:none; padding:30px 16px; text-align:center; }
  #done .code { font-size:34px; font-weight:800; color:var(--g); margin:8px 0; }
</style>
</head>
<body>
<header><h1>บันทึกลูกค้าใหม่</h1><small id="who">กำลังเชื่อมต่อ LINE…</small></header>

<div id="loading">กำลังโหลด…</div>
<div id="msg" class="msg"></div>

<form id="f" style="display:none" autocomplete="off">
  <div class="card">
    <div class="field"><label>ชื่อลูกค้า <span class="req">*</span></label><input name="name" required></div>
    <div class="field"><label>เบอร์โทร <span class="req">*</span></label><input name="phone" type="tel" inputmode="tel" required placeholder="08xxxxxxxx"></div>
  </div>

  <div class="card">
    <div class="field"><label>มาจากไหน <span class="req">*</span></label><div class="chips" data-name="source" data-list="แหล่งที่มา" data-req="1"></div></div>
    <div class="field"><label>แบบบ้านที่สนใจ <span class="req">*</span></label><div class="chips" data-name="model" data-list="แบบบ้าน/แปลง" data-req="1"></div></div>
  </div>

  <div class="card">
    <div class="field"><label>อาชีพ</label><div class="chips" data-name="occupation" data-list="อาชีพ"></div></div>
    <div class="field"><label>งบประมาณ (บาท)</label><input name="budget" inputmode="numeric" placeholder="เช่น 3500000"></div>
    <div class="field"><label>การเงิน</label><div class="chips" data-name="finance" data-list="การเงิน"></div></div>
    <div class="field"><label>ตัดสินใจเพราะอะไรเป็นหลัก</label><div class="chips" data-name="factor" data-list="ปัจจัยตัดสินใจ"></div></div>
  </div>

  <div class="card">
    <div class="field"><label>นัดติดตามครั้งถัดไป <span class="req">*</span></label>
      <div class="chips" id="dateChips"></div>
      <input type="date" name="nextDate" id="nextDate" style="margin-top:8px;display:none">
      <div class="hint" id="dateShow"></div>
    </div>
    <div class="field"><label>สิ่งที่ต้องทำ</label><div class="chips" data-name="nextAction" data-list="สิ่งที่ต้องทำ" data-default="โทรติดตาม"></div></div>
    <div class="field"><label>หมายเหตุ</label><textarea name="note" placeholder="เช่น มากับภรรยา ต้องการ 3 ห้องนอน"></textarea></div>
  </div>
</form>

<div id="done">
  <div>บันทึกแล้ว</div>
  <div class="code" id="doneCode"></div>
  <div id="doneMsg" class="hint"></div>
  <button class="main" id="again" style="margin-top:20px">บันทึกลูกค้าคนต่อไป</button>
  <button class="sec" id="close">ปิด</button>
</div>

<div class="bar" id="bar" style="display:none"><button class="main" id="send" form="f" type="submit">บันทึก</button></div>

<script>
/* ======= ตั้งค่า (แก้ 2 บรรทัดนี้เท่านั้น) ======= */
const LIFF_ID = 'PUT_LIFF_ID_HERE';
const API = 'https://script.google.com/macros/s/AKfycbyj6ZOt8QuMywuE-rAZzkQNVvnXHkQ2Ka-pyiIdGYivb-pmec1eX2YKANlKNMwLd02X/exec';
/* ================================================ */

const $ = s => document.querySelector(s);
const state = {};
let forceNext = false;

function show(type, text) { const m = $('#msg'); m.className = 'msg ' + type; m.textContent = text; window.scrollTo(0, 0); }
function hideMsg() { $('#msg').className = 'msg'; }

function ymd(d) { const z = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); }
function thDate(s) { if (!s) return ''; const [y, m, d] = s.split('-'); return 'วันที่ ' + (+d) + '/' + (+m) + '/' + y; }

function buildChips(el, items) {
  const name = el.dataset.name, def = el.dataset.default;
  el.innerHTML = '';
  items.forEach(v => {
    const c = document.createElement('div'); c.className = 'chip'; c.textContent = v;
    c.onclick = () => { const on = c.classList.contains('on');
      el.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
      if (!on) { c.classList.add('on'); state[name] = v; } else { delete state[name]; } };
    if (def && v === def) { c.classList.add('on'); state[name] = v; }
    el.appendChild(c);
  });
}

function buildDates() {
  const box = $('#dateChips'), inp = $('#nextDate');
  const opts = [['พรุ่งนี้', 1], ['3 วัน', 3], ['1 สัปดาห์', 7], ['2 สัปดาห์', 14], ['เลือกวันที่', null]];
  opts.forEach(([t, n]) => {
    const c = document.createElement('div'); c.className = 'chip'; c.textContent = t;
    c.onclick = () => {
      box.querySelectorAll('.chip').forEach(x => x.classList.remove('on')); c.classList.add('on');
      if (n === null) { inp.style.display = 'block'; inp.min = ymd(new Date()); state.nextDate = inp.value || ''; }
      else { inp.style.display = 'none'; const d = new Date(); d.setDate(d.getDate() + n); state.nextDate = ymd(d); }
      $('#dateShow').textContent = thDate(state.nextDate);
    };
    box.appendChild(c);
  });
  inp.onchange = () => { state.nextDate = inp.value; $('#dateShow').textContent = thDate(inp.value); };
}

async function start() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    const tok = liff.getDecodedIDToken();
    $('#who').textContent = 'ผู้บันทึก: ' + ((tok && tok.name) || 'ไม่ทราบชื่อ');

    const r = await fetch(API);
    const j = await r.json();
    if (!j.ok) throw new Error(j.msg || 'โหลดรายการไม่ได้');
    document.querySelectorAll('.chips[data-list]').forEach(el => buildChips(el, j.lists[el.dataset.list] || []));
    buildDates();
    $('#loading').style.display = 'none'; $('#f').style.display = 'block'; $('#bar').style.display = 'block';
  } catch (e) {
    $('#loading').style.display = 'none';
    show('err', 'เปิดฟอร์มไม่ได้: ' + e.message);
  }
}

$('#f').addEventListener('input', () => { forceNext = false; $('#send').textContent = 'บันทึก'; });

$('#f').onsubmit = async ev => {
  ev.preventDefault(); hideMsg();
  const f = ev.target;
  const data = { name: f.elements['name'].value.trim(), phone: f.elements['phone'].value.trim(), budget: f.elements['budget'].value.trim(), note: f.elements['note'].value.trim(), ...state };
  const miss = [];
  if (!data.name) miss.push('ชื่อลูกค้า');
  if (!data.phone) miss.push('เบอร์โทร');
  document.querySelectorAll('.chips[data-req]').forEach(el => { if (!state[el.dataset.name]) miss.push(el.previousElementSibling.textContent.replace('*', '').trim()); });
  if (!data.nextDate) miss.push('นัดติดตามครั้งถัดไป');
  if (miss.length) { show('err', 'ยังไม่ได้กรอก: ' + miss.join(', ')); return; }

  const btn = $('#send'); btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'newCustomer', idToken: liff.getIDToken(), data, force: forceNext }) });
    const j = await r.json();
    if (j.ok) {
      $('#f').style.display = 'none'; $('#bar').style.display = 'none';
      $('#doneCode').textContent = j.id; $('#doneMsg').textContent = j.msg; $('#done').style.display = 'block';
      window.scrollTo(0, 0);
    } else if (j.code === 'DUPLICATE') {
      show('warn', j.msg + ' — ถ้าเป็นคนละคนจริง (เช่น สามี/ภรรยาใช้เบอร์เดียวกัน) กด "บันทึกซ้ำอยู่ดี"');
      forceNext = true; btn.disabled = false; btn.textContent = 'บันทึกซ้ำอยู่ดี'; return;
    } else {
      show('err', j.msg || 'บันทึกไม่สำเร็จ');
    }
  } catch (e) {
    show('err', 'ส่งข้อมูลไม่ได้ ลองใหม่อีกครั้ง (' + e.message + ')');
  }
  btn.disabled = false; btn.textContent = 'บันทึก';
};

$('#again').onclick = () => location.reload();
$('#close').onclick = () => { if (liff.isInClient()) liff.closeWindow(); else window.close(); };

start();
</script>
</body>
</html>
